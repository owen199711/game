<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧙‍♀️ 女巫的毒药</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; min-height: 100dvh; background: #0a0a1a;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 8px;
    }
    .container {
      background: linear-gradient(145deg, #1a1a3e, #0d0d2b);
      border-radius: max(16px, 3vw); padding: max(12px, 2vw);
      box-shadow: 0 0 60px rgba(100, 60, 255, 0.3);
      max-width: 700px; width: 100%;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; flex-wrap: wrap;
      padding: 0 4px max(8px, 1.5vw) 4px; color: #c8b8ff;
      font-size: clamp(14px, 3vw, 18px); font-weight: bold;
      text-shadow: 0 0 20px rgba(150, 100, 255, 0.5);
    }
    canvas {
      display: block; border-radius: max(10px, 2vw);
      width: 100%; height: auto; aspect-ratio: 1/1;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
      touch-action: manipulation;
    }
    .status-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .turn-indicator {
      padding: 4px clamp(8px, 2vw, 14px); border-radius: 20px;
      font-size: clamp(11px, 2.5vw, 14px); font-weight: bold;
      transition: all 0.3s; white-space: nowrap;
    }
    .turn-p1 { background: rgba(100, 180, 255, 0.25); color: #8ac4ff; }
    .turn-p2 { background: rgba(255, 100, 150, 0.25); color: #ff8aaa; }
    .turn-wait { background: rgba(255, 200, 100, 0.15); color: #cca866; }
    .turn-idle { background: rgba(150, 100, 255, 0.15); color: #a88aff; }
    .turn-win  { background: rgba(100, 255, 150, 0.2);  color: #8affaa; }
    .turn-lose { background: rgba(255, 80, 80, 0.2);    color: #ff8888; }

    .btn {
      background: rgba(150, 100, 255, 0.2);
      border: 2px solid #8b6aff; color: #c8b8ff;
      padding: clamp(6px, 1.5vw, 10px) clamp(12px, 3vw, 20px);
      border-radius: 30px;
      font-size: clamp(12px, 2.5vw, 14px); font-weight: bold;
      cursor: pointer; transition: all 0.2s;
      touch-action: manipulation;
    }
    .btn:active { background: rgba(150, 100, 255, 0.4); }
    @media (hover: hover) {
      .btn:hover { background: rgba(150, 100, 255, 0.4); box-shadow: 0 0 20px rgba(150, 100, 255, 0.4); }
      .btn-primary:hover { background: rgba(100, 180, 255, 0.4); }
    }
    .btn-primary { background: rgba(100, 180, 255, 0.25); border-color: #5a9eff; color: #8ac4ff; }

    #lobby {
      display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 3vw, 20px);
      padding: clamp(30px, 8vw, 60px) clamp(12px, 3vw, 20px) clamp(20px, 5vw, 40px);
      color: #c8b8ff;
    }
    #lobby h1 { font-size: clamp(24px, 6vw, 36px); text-shadow: 0 0 30px rgba(150, 100, 255, 0.5); }
    #lobby p { color: #8878aa; font-size: clamp(12px, 2.5vw, 15px); text-align: center; }
    .lobby-actions { display: flex; gap: clamp(8px, 2vw, 16px); flex-wrap: wrap; justify-content: center; width: 100%; }
    .room-input { display: flex; gap: 8px; align-items: center; flex: 1; min-width: 0; max-width: 300px; }
    .room-input input {
      background: rgba(30, 20, 60, 0.8); border: 2px solid #5a4a8a;
      color: #c8b8ff; padding: 10px 8px; border-radius: 12px;
      font-size: clamp(18px, 4vw, 22px); font-weight: bold;
      width: 0; flex: 1; min-width: 80px;
      text-align: center; letter-spacing: 4px; text-transform: uppercase;
    }
    .room-input input:focus { outline: none; border-color: #8b6aff; }
    .error-msg { color: #ff6a6a; font-size: clamp(12px, 2.5vw, 14px); min-height: 20px; text-align: center; }
    #gameArea { display: none; }
    .footer-text { font-size: clamp(11px, 2vw, 13px); color: #665588; padding: 8px; text-align: center; }
    #reconnectBanner {
      display: none; text-align: center; padding: 8px;
      background: rgba(255, 200, 100, 0.1); border-radius: 12px;
      margin-bottom: 8px; border: 1px solid rgba(255, 200, 100, 0.2);
      font-size: clamp(11px, 2.5vw, 14px);
    }

    /* 手机端优化 */
    @media (max-width: 480px) {
      body { padding: 4px; }
      .container { padding: 10px; border-radius: 14px; }
      .header { font-size: 13px; }
      #lobby { padding-top: 20px; }
      #lobby h1 { font-size: 22px; }
      .room-input input { padding: 12px 6px; }
      .btn { padding: 10px 16px; font-size: 13px; }
      /* 消除手机点击高亮 */
      canvas { -webkit-tap-highlight-color: transparent; }
    }

    /* 平板优化 */
    @media (min-width: 768px) {
      .container { padding: 30px; }
      #lobby { padding-top: 50px; }
    }

    /* 横屏手机 */
    @media (max-height: 500px) and (orientation: landscape) {
      .container { max-width: 500px; }
      #lobby { padding-top: 10px; gap: 10px; }
      #lobby h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <span>🧙‍♀️ 女巫的毒药 <span id="roundDisplay" style="font-size:14px; color:#8878aa;"></span></span>
    <div class="status-bar">
      <span id="scoreDisplay" style="font-size:14px; color:#ffd866; display:none; margin-right:8px;"></span>
      <span class="turn-indicator turn-idle" id="turnIndicator">等待中</span>
      <button class="btn" id="leaveBtn">🚪 离开</button>
    </div>
  </div>

  <div id="lobby">
    <h1>🧙‍♀️ 女巫的毒药</h1>
    <p>双人心理博弈 — 谁先吃到对方的毒药谁就输！</p>
    <div class="lobby-actions">
      <button class="btn btn-primary" id="createBtn">🏠 创建房间</button>
      <div class="room-input">
        <input type="text" id="roomCodeInput" maxlength="4" placeholder="房号" />
        <button class="btn" id="joinBtn">🔑 加入</button>
      </div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div id="connStatus" style="font-size:12px; color:#665588; text-align:center;"></div>
    <div class="footer-text">两台设备打开同一页面，一人创建一人加入</div>
  </div>

  <div id="gameArea">
    <div id="reconnectBanner">
      <span id="reconnectText"></span>
      <button class="btn" id="reconnectBtn" style="margin-left:10px; padding:4px 14px; font-size:13px;">🔄 重新连接</button>
    </div>
    <div id="roomCodeDisplay" style="text-align:center; padding:8px 0 16px; display:none;">
      <div style="background:rgba(100,60,200,0.15); border:2px dashed #8b6aff; border-radius:16px; padding:12px 20px; display:inline-block;">
        <div style="font-size:13px; color:#8878aa; margin-bottom:4px;">📋 房间号（分享给朋友）</div>
        <div id="roomCodeText" style="font-size:clamp(28px, 8vw, 40px); letter-spacing:clamp(4px, 2vw, 10px); color:#ffd866; font-weight:bold;"></div>
      </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div style="text-align:center; padding-top:12px;">
      <button class="btn" id="copyCodeBtn" style="display:none;">📋 复制房间号</button>
    </div>
    <div id="reconnectingMsg" style="display:none; text-align:center; padding:16px; color:#ffd866; font-size:16px;">🔄 正在重新连接到房间...</div>
  </div>
</div>

<script>
  const socket = io();

  // ===== DOM =====
  const lobby = document.getElementById('lobby');
  const gameArea = document.getElementById('gameArea');
  const turnIndicator = document.getElementById('turnIndicator');
  const errorMsg = document.getElementById('errorMsg');
  const roomCodeInput = document.getElementById('roomCodeInput');
  const createBtn = document.getElementById('createBtn');
  const joinBtn = document.getElementById('joinBtn');
  const leaveBtn = document.getElementById('leaveBtn');
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const roomCodeDisplay = document.getElementById('roomCodeDisplay');
  const roomCodeText = document.getElementById('roomCodeText');
  const copyCodeBtn = document.getElementById('copyCodeBtn');
  const connStatus = document.getElementById('connStatus');
  const reconnectBanner = document.getElementById('reconnectBanner');
  const reconnectText = document.getElementById('reconnectText');
  const reconnectBtn = document.getElementById('reconnectBtn');
  const reconnectingMsg = document.getElementById('reconnectingMsg');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const roundDisplay = document.getElementById('roundDisplay');

  // ===== 游戏状态变量 =====
  let myIndex = 0;
  let roomCode = '';
  let phase = 'waiting';
  let currentPlayer = 0;
  let foods = [];
  let eatenSet = new Set();
  let winner = 0;
  let poisonP1 = -1;
  let poisonP2 = -1;
  let myPoison = -1;
  let poisonConfirmed = false;
  let frame = 0;
  let shakeIdx = -1;
  let shakeTimer = 0;
  let revealTimer = 0;
  let myTempPoison = -1;
  let scores = [{ win: 0, lose: 0 }, { win: 0, lose: 0 }];
  let round = 0;

  // 连接状态
  socket.on('connect', () => {
    console.log('[socket] 已连接, id:', socket.id);
    connStatus.textContent = '✅ 已连接';
    connStatus.style.color = '#8affaa';
    tryReconnect();
  });
  socket.on('connect_error', (err) => {
    console.error('[socket] 连接错误:', err.message);
    connStatus.textContent = '❌ 无法连接服务器';
    connStatus.style.color = '#ff8888';
  });
  socket.on('disconnect', (reason) => {
    console.log('[socket] 已断开, 原因:', reason);
    connStatus.textContent = '⚠️ 已断开';
    connStatus.style.color = '#ffaa44';
  });

  // ===== localStorage 存房间号和身份 =====
  function saveRoomInfo(code, playerIndex) {
    try {
      localStorage.setItem('witch_room_code', code);
      localStorage.setItem('witch_player_index', playerIndex);
    } catch(e) {}
  }
  function clearRoomInfo() {
    try {
      localStorage.removeItem('witch_room_code');
      localStorage.removeItem('witch_player_index');
    } catch(e) {}
  }
  function getSavedRoom() {
    try {
      const code = localStorage.getItem('witch_room_code');
      const idx = localStorage.getItem('witch_player_index');
      if (code && idx) return { code, playerIndex: parseInt(idx) };
    } catch(e) {}
    return null;
  }

  // ===== 自动重连（使用 localStorage 中的 playerIndex） =====
  let reconnectAttempted = false;

  function tryReconnect() {
    if (reconnectAttempted) return;
    const saved = getSavedRoom();
    if (!saved) return;
    reconnectAttempted = true;

    socket.emit('get_room_state', saved.code);
    socket.once('room_state', (state) => {
      if (state && state.exists && state.used[saved.playerIndex - 1]) {
        // 该 slot 有人（可能是断线状态），尝试重连
        reconnectingMsg.style.display = 'block';
        lobby.style.display = 'none';
        gameArea.style.display = 'block';
        setIndicator('🔄 正在重新连接...', 'turn-wait');
        socket.emit('rejoin_room', { code: saved.code, playerIndex: saved.playerIndex });
      } else {
        clearRoomInfo();
      }
    });

    setTimeout(() => {
      if (reconnectingMsg.style.display === 'block') {
        reconnectingMsg.style.display = 'none';
        lobby.style.display = '';
        gameArea.style.display = 'none';
        clearRoomInfo();
      }
    }, 5000);
  }

  // ===== Socket 事件 =====
  socket.on('room_created', (data) => {
    console.log('[room_created] 收到事件:', JSON.stringify(data), 'socket connected:', socket.connected);
    try {
      roomCode = data.code;
      myIndex = data.playerIndex;
      saveRoomInfo(data.code, data.playerIndex);
      roomCodeText.textContent = roomCode;
      roomCodeDisplay.style.display = 'block';
      copyCodeBtn.style.display = 'inline-block';
      showGame();
      console.log('[room_created] UI更新完成');
    } catch (e) {
      console.error('[room_created] 处理出错:', e);
    }
  });

  socket.on('room_joined', (data) => {
    roomCode = data.code;
    myIndex = data.playerIndex;
    if (data.scores) scores = data.scores;
    saveRoomInfo(data.code, data.playerIndex);
    showGame();
  });

  socket.on('player_joined', (data) => {
    if (data && data.scores) {
      scores = data.scores;
      updateScoreDisplay();
    }
    socket.emit('start_game');
  });

  socket.on('game_start', (data) => {
    foods = data.foods;
    phase = data.state;
    currentPlayer = data.currentPlayer;
    if (data.scores) scores = data.scores;
    if (data.round !== undefined) round = data.round;
    eatenSet.clear();
    winner = 0;
    poisonP1 = -1;
    poisonP2 = -1;
    myPoison = -1;
    myTempPoison = -1;
    poisonConfirmed = false;
    shakeIdx = -1;
    shakeTimer = 0;
    revealTimer = 0;
    roomCodeDisplay.style.display = 'none';
    copyCodeBtn.style.display = 'none';
    reconnectingMsg.style.display = 'none';
    updateScoreDisplay();
    updateIndicator();
  });

  socket.on('poison_set', (data) => {
    phase = data.state;
    currentPlayer = data.currentPlayer;
    if (data.poisonP1 !== undefined) poisonP1 = data.poisonP1;
    if (data.poisonP2 !== undefined) poisonP2 = data.poisonP2;
    if (data.scores) scores = data.scores;
    if (data.round !== undefined) round = data.round;
    updateScoreDisplay();
    updateIndicator();
  });

  socket.on('poison_confirmed', () => {
    poisonConfirmed = true;
  });

  socket.on('eat_result', (data) => {
    data.eaten.forEach(i => eatenSet.add(i));
    currentPlayer = data.currentPlayer;
    shakeIdx = data.eatenIdx;
    shakeTimer = 15;
    phase = 'playing';
    updateIndicator();
  });

  socket.on('game_over', (data) => {
    data.eaten.forEach(i => eatenSet.add(i));
    poisonP1 = data.poisonP1;
    poisonP2 = data.poisonP2;
    winner = data.winner;
    phase = 'gameover';
    shakeIdx = data.eatenIdx || -1;
    shakeTimer = 20;
    revealTimer = 50;
    if (data.scores) scores = data.scores;
    if (data.round !== undefined) round = data.round;
    updateScoreDisplay();
    updateIndicator();
  });

  // ===== 重连相关事件 =====
  socket.on('rejoin_success', (data) => {
    reconnectingMsg.style.display = 'none';
    // 恢复完整游戏状态（服务端通过 IP 匹配，自动告诉 playerIndex）
    foods = data.foods;
    phase = data.state;
    currentPlayer = data.currentPlayer;
    winner = data.winner;
    poisonP1 = data.poisonP1;
    poisonP2 = data.poisonP2;
    eatenSet = new Set(data.eaten);
    myIndex = data.playerIndex;
    if (data.scores) scores = data.scores;
    if (data.round !== undefined) round = data.round;
    saveRoomInfo(roomCode, data.playerIndex);
    myTempPoison = (data.state === 'p1_setup' && data.playerIndex === 1) ? data.poisonP1 :
                   (data.state === 'p2_setup' && data.playerIndex === 2) ? data.poisonP2 : -1;
    myPoison = myTempPoison;
    shakeIdx = -1;
    shakeTimer = 0;
    revealTimer = 0;
    updateScoreDisplay();
    updateIndicator();
    if (data.state === 'gameover') revealTimer = 50;
  });

  socket.on('rejoin_failed', (msg) => {
    reconnectingMsg.style.display = 'none';
    clearRoomInfo();
    lobby.style.display = '';
    gameArea.style.display = 'none';
    showError(msg || '重连失败');
  });

  socket.on('opponent_disconnected', () => {
    reconnectBanner.style.display = 'block';
    reconnectText.textContent = '⚠️ 对手已断开连接，等待重连...';
    if (phase === 'playing') {
      setIndicator('⏳ 对手断线了...', 'turn-idle');
    }
  });

  socket.on('opponent_reconnected', () => {
    reconnectBanner.style.display = 'none';
    updateIndicator();
  });

  socket.on('opponent_left', () => {
    clearRoomInfo();
    showError('对手已离开');
    setTimeout(() => window.location.reload(), 2000);
  });

  socket.on('error_msg', (msg) => {
    showError(msg);
  });

  // ===== 大厅逻辑 =====

  createBtn.addEventListener('click', () => {
    console.log('[创建房间] 按钮被点击, socket id:', socket.id, 'connected:', socket.connected);
    reconnectAttempted = true;
    clearRoomInfo();
    socket.emit('create_room');
    console.log('[创建房间] create_room 事件已发送');
  });

  // 输入房间号后，直接以玩家2身份加入
  joinBtn.addEventListener('click', () => {
    const code = roomCodeInput.value.trim();
    if (code.length !== 4) {
      showError('请输入4位房间号');
      return;
    }
    reconnectAttempted = true;
    clearRoomInfo();
    socket.emit('join_room', { code: code.toUpperCase(), playerIndex: 2 });
  });

  roomCodeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') joinBtn.click();
  });

  // 离开房间 → 通知服务端清理 slot
  leaveBtn.addEventListener('click', () => {
    clearRoomInfo();
    socket.emit('leave_room');
    window.location.reload();
  });

  copyCodeBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(roomCode).then(() => {
      copyCodeBtn.textContent = '✅ 已复制！';
      setTimeout(() => { copyCodeBtn.textContent = '📋 复制房间号'; }, 2000);
    });
  });

  reconnectBtn.addEventListener('click', () => {
    const saved = getSavedRoom();
    if (saved) {
      reconnectingMsg.style.display = 'block';
      socket.emit('rejoin_room', { code: saved.code, playerIndex: saved.playerIndex });
    }
  });

  function showError(msg) { errorMsg.textContent = msg; setTimeout(() => { if (errorMsg.textContent === msg) errorMsg.textContent = ''; }, 3000); }

  // ===== Canvas 自适应大小 =====
  let W, H, GRID_SIZE, CELL_SIZE, PADDING, RADIUS, FONT_SM, FONT_MD, FONT_LG, FONT_XL;
  function initGameConstants() {
    W = canvas.width;
    H = canvas.height;
    GRID_SIZE = 5;
    CELL_SIZE = W / GRID_SIZE;
    PADDING = Math.max(4, W * 0.015);
    RADIUS = Math.max(4, W * 0.015);
    FONT_SM = Math.round(W * 0.035);
    FONT_MD = Math.round(W * 0.043);
    FONT_LG = Math.round(W * 0.058);
    FONT_XL = Math.round(W * 0.068);
  }

  function resizeCanvas() {
    const container = canvas.parentElement;
    const maxW = Math.min(container.clientWidth - 4, 650);
    const size = Math.max(280, maxW);
    canvas.width = size;
    canvas.height = size;
    initGameConstants();
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);



  // ===== 显示 =====
  function showGame() {
    lobby.style.display = 'none';
    gameArea.style.display = 'block';
    if (myIndex === 1) {
      setIndicator('等待另一位玩家加入...', 'turn-wait');
    } else {
      setIndicator('已加入房间，等待房主开始...', 'turn-wait');
    }
  }

  function updateScoreDisplay() {
    if (scores[0].win + scores[0].lose + scores[1].win + scores[1].lose === 0) {
      scoreDisplay.style.display = 'none';
      return;
    }
    scoreDisplay.style.display = 'inline';
    const me = scores[myIndex - 1];
    const opp = scores[myIndex === 1 ? 1 : 0];
    scoreDisplay.textContent = `🏆 ${me.win}胜 ${me.lose}负  |  对手 ${opp.win}胜 ${opp.lose}负`;
    if (round > 0) {
      roundDisplay.textContent = `第 ${round + 1} 局`;
    }
  }

  function setIndicator(text, cls) {
    turnIndicator.className = 'turn-indicator ' + cls;
    turnIndicator.textContent = text;
  }

  function updateIndicator() {
    if (phase === 'p1_setup') {
      if (myIndex === 1) setIndicator('🙈 选择你的毒药', 'turn-p1');
      else setIndicator('🙈 玩家1 正在下毒...', 'turn-wait');
    } else if (phase === 'p2_setup') {
      if (myIndex === 2) setIndicator('🙈 选择你的毒药', 'turn-p2');
      else setIndicator('🙈 玩家2 正在下毒...', 'turn-wait');
    } else if (phase === 'playing') {
      if (currentPlayer === myIndex) setIndicator('🎯 轮到你吃了！', currentPlayer === 1 ? 'turn-p1' : 'turn-p2');
      else setIndicator('⏳ 对手思考中...', 'turn-idle');
    } else if (phase === 'gameover') {
      if (winner === 0) setIndicator('🤝 平局！', 'turn-idle');
      else if (winner === myIndex) setIndicator('👑 你赢了！', 'turn-win');
      else setIndicator('💀 你输了！', 'turn-lose');
    }
  }

  // ===== Canvas =====
  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    let cx, cy;
    if (e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
    else { cx = e.clientX; cy = e.clientY; }
    return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
  }

  function isMyTurn() {
    return (phase === 'p1_setup' && myIndex === 1) ||
           (phase === 'p2_setup' && myIndex === 2) ||
           (phase === 'playing' && currentPlayer === myIndex);
  }

  function handleClick(mx, my) {
    const col = Math.floor(mx / CELL_SIZE);
    const row = Math.floor(my / CELL_SIZE);
    const idx = row * GRID_SIZE + col;
    if (idx < 0 || idx >= GRID_SIZE * GRID_SIZE) return;
    if (phase === 'gameover') {
      socket.emit('next_round');
      return;
    }

    if (phase === 'p1_setup' && myIndex === 1) {
      myPoison = idx;
      myTempPoison = idx;
      socket.emit('set_poison', idx);
      setIndicator('✅ 毒药已下，等待玩家2...', 'turn-wait');
      return;
    }

    if (phase === 'p2_setup' && myIndex === 2) {
      myPoison = idx;
      myTempPoison = idx;
      socket.emit('set_poison', idx);
      setIndicator('✅ 毒药已下，等待开始...', 'turn-wait');
      return;
    }

    if (phase === 'playing' && currentPlayer === myIndex) {
      if (eatenSet.has(idx)) return;
      socket.emit('eat_food', idx);
    }
  }

  canvas.addEventListener('mousedown', (e) => handleClick(...Object.values(getCanvasPos(e))));
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleClick(...Object.values(getCanvasPos(e)));
  }, { passive: false });

  // ===== 绘制 =====
  function update() {
    frame++;
    if (shakeTimer > 0) shakeTimer--;
    if (revealTimer > 0) revealTimer--;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawGrid();

    if ((phase === 'p1_setup' || phase === 'p2_setup') && myTempPoison >= 0) {
      const col = myTempPoison % GRID_SIZE;
      const row = Math.floor(myTempPoison / GRID_SIZE);
      const px = col * CELL_SIZE + CELL_SIZE/2;
      const py = row * CELL_SIZE + CELL_SIZE/2;
      ctx.font = FONT_SM + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = myIndex === 1 ? 'rgba(100, 180, 255, 0.8)' : 'rgba(255, 100, 150, 0.8)';
      ctx.fillText('☠️', px + 22, py - 22);
    }

    if (phase === 'gameover' && revealTimer <= 0) {
      [poisonP1, poisonP2].forEach((pi, i) => {
        if (pi < 0) return;
        const col = pi % GRID_SIZE, row = Math.floor(pi / GRID_SIZE);
        const px = col * CELL_SIZE + CELL_SIZE/2, py = row * CELL_SIZE + CELL_SIZE/2;
        ctx.font = FONT_SM + 'px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = i === 0 ? 'rgba(100, 180, 255, 0.9)' : 'rgba(255, 100, 150, 0.9)';
        ctx.fillText('☠️', px + 22, py - 22);
      });
    }

    drawOverlay();
  }

  function drawBackground() {
    const grad = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, 450);
    grad.addColorStop(0, '#1a1a4e'); grad.addColorStop(0.5, '#0d0d2b'); grad.addColorStop(1, '#050510');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 60; i++) {
      const sx = (i * 137.5 + 50) % W, sy = (i * 97.3 + 30) % H;
      const t = 0.3 + 0.7 * Math.sin(frame * 0.02 + i * 3);
      ctx.globalAlpha = t * 0.3; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(sx, sy, 0.5 + (i % 3) * 0.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawGrid() {
    for (let row = 0; row < GRID_SIZE; row++) {
      for (let col = 0; col < GRID_SIZE; col++) {
        const idx = row * GRID_SIZE + col;
        const x = col * CELL_SIZE, y = row * CELL_SIZE;
        const isEaten = eatenSet.has(idx);
        const isShaking = idx === shakeIdx && shakeTimer > 0;

        let bx = x, by = y;
        if (isShaking) { bx += Math.sin(frame * 0.5) * 6; by += Math.cos(frame * 0.7) * 3; }

        ctx.save();
        ctx.translate(bx, by);
        if (isEaten) {
          ctx.fillStyle = 'rgba(30, 20, 40, 0.7)';
          roundRect(ctx, PADDING, PADDING, CELL_SIZE - PADDING*2, CELL_SIZE - PADDING*2, RADIUS);
          ctx.fill();
          ctx.font = FONT_MD + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(100, 80, 120, 0.4)';
          ctx.fillText('💀', CELL_SIZE/2, CELL_SIZE/2);
        } else if (phase === 'gameover' && revealTimer <= 0 && (idx === poisonP1 || idx === poisonP2)) {
          const isP1 = idx === poisonP1;
          ctx.fillStyle = isP1 ? 'rgba(100, 180, 255, 0.2)' : 'rgba(255, 100, 150, 0.2)';
          ctx.shadowColor = isP1 ? '#4488ff' : '#ff4488';
          ctx.shadowBlur = 12;
          roundRect(ctx, PADDING, PADDING, CELL_SIZE - PADDING*2, CELL_SIZE - PADDING*2, RADIUS);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.font = FONT_LG + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(foods[idx], CELL_SIZE/2, CELL_SIZE/2);
        } else {
          ctx.fillStyle = 'rgba(50, 40, 80, 0.4)';
          ctx.shadowColor = 'rgba(150, 100, 255, 0.15)'; ctx.shadowBlur = 8;
          roundRect(ctx, PADDING, PADDING, CELL_SIZE - PADDING*2, CELL_SIZE - PADDING*2, RADIUS);
          ctx.fill(); ctx.shadowBlur = 0;
          ctx.font = FONT_LG + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(foods[idx], CELL_SIZE/2, CELL_SIZE/2);
        }
        ctx.restore();
      }
    }
    ctx.strokeStyle = 'rgba(150, 100, 255, 0.08)'; ctx.lineWidth = 1;
    for (let i = 0; i <= GRID_SIZE; i++) {
      const pos = i * CELL_SIZE;
      ctx.beginPath(); ctx.moveTo(pos, 0); ctx.lineTo(pos, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, pos); ctx.lineTo(W, pos); ctx.stroke();
    }
  }

  function drawOverlay() {
    if (phase === 'gameover') {
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      // 积分
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffd866';
      ctx.font = 'bold ' + FONT_SM + 'px "Segoe UI", Arial, sans-serif';
      const meScore = scores[myIndex - 1];
      const oppScore = scores[myIndex === 1 ? 1 : 0];
      ctx.fillText(`🏆 你 ${meScore.win}胜 ${meScore.lose}负   vs   对手 ${oppScore.win}胜 ${oppScore.lose}负`, W/2, H/2 - 70);

      if (winner === 0) {
        ctx.shadowColor = '#ffd866'; ctx.shadowBlur = 30;
        ctx.fillStyle = '#ffd866';
        ctx.font = 'bold ' + FONT_LG + 'px "Segoe UI", Arial, sans-serif';
        ctx.fillText('🤝 平局！', W/2, H/2 - 20);
      } else {
        const isMe = winner === myIndex;
        ctx.shadowColor = isMe ? '#ffd700' : '#ff4466'; ctx.shadowBlur = 40;
        ctx.fillStyle = isMe ? '#ffd700' : '#ff4466';
        ctx.font = 'bold ' + FONT_XL + 'px "Segoe UI", Arial, sans-serif';
        ctx.fillText(isMe ? '👑 你赢了！' : '💀 你输了！', W/2, H/2 - 20);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#c8b8ff';
        ctx.font = FONT_MD + 'px "Segoe UI", Arial, sans-serif';
        ctx.fillText(isMe ? '对手吃到了你的毒药！' : '你吃到了对手的毒药！', W/2, H/2 + 20);
      }
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(200, 180, 255, 0.6)';
      ctx.font = FONT_SM + 'px "Segoe UI", Arial, sans-serif';
      ctx.fillText('👆 点击进入下一局', W/2, H/2 + 75);
    } else if (!isMyTurn() && phase !== 'gameover' && phase !== 'waiting') {
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  }

  // ===== 循环 =====
  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();
</script>
</body>
